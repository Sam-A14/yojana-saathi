name: Approve scheme proposal

# Manual only, and only from main. Turns one reviewed LLM proposal (a row in review_items) into
# data/schemes_seed/<slug>.json and opens a pull request that shows the file's diff and the source
# quote behind every rule. It READS the database and writes nothing to it. A person reviews and
# merges the pull request; then the existing "Seed database" workflow loads the file. Nothing is
# published without that pull request (decision 032).
#
# One-time repository setting: Settings > Actions > General > Workflow permissions >
# "Allow GitHub Actions to create and approve pull requests". Without it the last step fails with
# "GitHub Actions is not permitted to create or approve pull requests".
# Uses the same DATABASE_URL secret as the seed and extract workflows.
on:
  workflow_dispatch:
    inputs:
      review_item_id:
        description: "Review item number (the 'review item' line of the Extract scheme rules run)"
        required: true
        type: string
      approver:
        description: "Your GitHub user name. It is saved in the file as approved_by."
        required: true
        type: string

# contents: push the branch. pull-requests: open the pull request. Nothing else.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: approve-scheme-${{ inputs.review_item_id }}
  cancel-in-progress: false

jobs:
  approve:
    # An unreviewed branch must not be able to open pull requests from production data.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt

      - name: Write the seed file from the review item
        id: approve
        shell: bash
        working-directory: backend
        # Both inputs are typed by a person. They reach the script only through environment
        # variables and are checked before use, never pasted into the script text.
        env:
          REVIEW_ITEM_ID: ${{ inputs.review_item_id }}
          APPROVER: ${{ inputs.approver }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::The DATABASE_URL secret is not set. See 'Seed the database' in README.md."
            exit 1
          fi
          if ! [[ "$REVIEW_ITEM_ID" =~ ^[0-9]{1,9}$ ]]; then
            echo "::error::The review item must be a number, for example 2."
            exit 1
          fi
          if [ "${#APPROVER}" -gt 39 ] || ! [[ "$APPROVER" =~ ^[A-Za-z0-9]+(-[A-Za-z0-9]+)*$ ]]; then
            echo "::error::The approver must be a GitHub user name (letters, digits, single hyphens)."
            exit 1
          fi
          # The command prints only the slug on stdout; every refusal goes to stderr and exits 1.
          slug=$(python -m app.pipeline.approve "$REVIEW_ITEM_ID" --approver "$APPROVER" \
            --body-file "$RUNNER_TEMP/pr-body.md")
          if ! [[ "$slug" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
            echo "::error::The command did not return a valid slug."
            exit 1
          fi
          echo "slug=$slug" >> "$GITHUB_OUTPUT"

      # The job's own check, because a pull request opened by a workflow does not start CI.
      # No database variable here: these tests only read the files.
      - name: Check the seed files and test profiles
        shell: bash
        working-directory: backend
        run: python -m pytest tests/test_seed_files.py tests/test_rules_profiles.py -q

      - name: Open the pull request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SLUG: ${{ steps.approve.outputs.slug }}
          REVIEW_ITEM_ID: ${{ inputs.review_item_id }}
          APPROVER: ${{ inputs.approver }}
        run: |
          if [ -z "$(git status --porcelain -- data/schemes_seed)" ]; then
            echo "Nothing to approve: data/schemes_seed/$SLUG.json already matches this proposal." \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          branch="approve/${SLUG}-item-${REVIEW_ITEM_ID}-run-${GITHUB_RUN_NUMBER}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add "data/schemes_seed/${SLUG}.json"
          git commit -m "Add scheme ${SLUG} (review item ${REVIEW_ITEM_ID}, approved by ${APPROVER})"
          git push origin "$branch"
          url=$(gh pr create --base main --head "$branch" \
            --title "Approve scheme: ${SLUG}" --body-file "$RUNNER_TEMP/pr-body.md")
          echo "Pull request opened: $url" | tee -a "$GITHUB_STEP_SUMMARY"
