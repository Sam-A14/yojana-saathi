name: Add scheme

# Manual only, and only from main. One run does the whole job that used to be three:
#   1. writes data/scheme_sources/<slug>.txt from the page text you give it,
#   2. extracts and validates the rules with the LLM (saves a review item, like "Extract scheme rules"),
#   3a. if the proposal is valid: writes data/schemes_seed/<slug>.json (like "Approve scheme proposal")
#       and opens ONE pull request with both files,
#   3b. if it is not valid: opens (or comments on) a GitHub issue that lists the problems.
# There is no automatic retry. Nothing is published by this workflow: a person reads the pull
# request and merges it; "Seed database" then runs by itself (decisions 032 and 046).
#
# approved_by in the file is the person who STARTED this run. It is set before anyone has read the
# pull request, so the pull request says plainly that merging is the verification.
#
# Needs the same repository secrets as the two workflows it replaces: LLM_API_KEY and DATABASE_URL,
# and the setting Settings > Actions > General > "Allow GitHub Actions to create and approve pull
# requests". The optional repository variable LLM_MODEL picks the model.
on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Scheme slug, for example up-obc-post-matric (lowercase words joined by -)"
        required: true
        type: string
      source_text:
        description: "The scheme page text. Line 1 must be the page URL, then the text as pasted."
        required: true
        type: string

# contents: push the branch. pull-requests: open the pull request. issues: report problems.
permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: add-scheme-${{ inputs.slug }}
  cancel-in-progress: false

jobs:
  add:
    # An unreviewed branch must not write to production or open pull requests from production data.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt

      - name: Write the source file
        shell: bash
        working-directory: backend
        # The slug and the text are typed by a person. They reach the script only through
        # environment variables and are checked in Python, never pasted into the script text.
        env:
          SLUG: ${{ inputs.slug }}
          SOURCE_TEXT: ${{ inputs.source_text }}
        run: python -m app.pipeline.add_scheme write-source "$SLUG"

      - name: Extract and validate the rules
        id: extract
        shell: bash
        working-directory: backend
        env:
          SLUG: ${{ inputs.slug }}
          LLM_PROVIDER: gemini
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$LLM_API_KEY" ] || [ -z "$DATABASE_URL" ]; then
            echo "::error::The LLM_API_KEY and DATABASE_URL secrets must both be set."
            exit 1
          fi
          # The report goes to a file, not the log: it contains model output, and the log would
          # treat a line starting with "::" as a workflow command.
          python -m app.pipeline.extract_cli "$SLUG" \
            --result-file "$RUNNER_TEMP/extract-result.json" > "$RUNNER_TEMP/extract-report.md"
          echo "review_item_id=$(jq -r '.review_item_id' "$RUNNER_TEMP/extract-result.json")" >> "$GITHUB_OUTPUT"
          echo "is_valid=$(jq -r '.is_valid' "$RUNNER_TEMP/extract-result.json")" >> "$GITHUB_OUTPUT"

      - name: Show the proposal in the run summary
        if: always()
        shell: bash
        run: |
          if [ -s "$RUNNER_TEMP/extract-report.md" ]; then
            cat "$RUNNER_TEMP/extract-report.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Not valid: tell a person where to look, then fail the run so it shows red.
      - name: Report the problems in an issue
        if: steps.extract.outputs.is_valid == 'false'
        shell: bash
        working-directory: backend
        env:
          GH_TOKEN: ${{ github.token }}
          SLUG: ${{ inputs.slug }}
        run: |
          python -m app.pipeline.add_scheme issue-body "$RUNNER_TEMP/extract-result.json" \
            > "$RUNNER_TEMP/issue.md"
          title="Add scheme failed validation: ${SLUG}"
          existing=$(gh issue list --state open --search "\"$title\" in:title" \
            --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file "$RUNNER_TEMP/issue.md"
            echo "Problems added to issue #$existing." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            url=$(gh issue create --title "$title" --body-file "$RUNNER_TEMP/issue.md")
            echo "Issue opened: $url" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          echo "::error::The proposal failed validation. See the issue and the run summary."
          exit 1

      - name: Write the seed file from the review item
        id: approve
        if: steps.extract.outputs.is_valid == 'true'
        shell: bash
        working-directory: backend
        env:
          REVIEW_ITEM_ID: ${{ steps.extract.outputs.review_item_id }}
          APPROVER: ${{ github.actor }}
          SLUG: ${{ inputs.slug }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          slug=$(python -m app.pipeline.approve "$REVIEW_ITEM_ID" --approver "$APPROVER" \
            --body-file "$RUNNER_TEMP/approve-body.md")
          if [ "$slug" != "$SLUG" ]; then
            echo "::error::The approved scheme is '$slug', not '$SLUG'."
            exit 1
          fi
          python -m app.pipeline.add_scheme pr-notice --actor "$APPROVER" --slug "$SLUG" \
            > "$RUNNER_TEMP/pr-body.md"
          cat "$RUNNER_TEMP/approve-body.md" >> "$RUNNER_TEMP/pr-body.md"

      # The job's own check, because a pull request opened by a workflow does not start CI.
      # No database variable here: these tests only read the files.
      - name: Check the seed files and test profiles
        if: steps.extract.outputs.is_valid == 'true'
        shell: bash
        working-directory: backend
        run: python -m pytest tests/test_seed_files.py tests/test_rules_profiles.py -q

      - name: Open the pull request
        if: steps.extract.outputs.is_valid == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SLUG: ${{ inputs.slug }}
          APPROVER: ${{ github.actor }}
        run: |
          branch="add/${SLUG}-run-${GITHUB_RUN_NUMBER}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add "data/scheme_sources/${SLUG}.txt" "data/schemes_seed/${SLUG}.json"
          git commit -m "Add scheme ${SLUG} (started by ${APPROVER})"
          git push origin "$branch"
          url=$(gh pr create --base main --head "$branch" \
            --title "Add scheme: ${SLUG}" --body-file "$RUNNER_TEMP/pr-body.md")
          echo "Pull request opened: $url" | tee -a "$GITHUB_STEP_SUMMARY"
